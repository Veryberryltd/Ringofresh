<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#FAFAFA;}</style>
</helmet>
<div style="background:#FAFAFA;font-family:'Manrope',sans-serif;color:#241F1A;">
  <dc-import name="Nav" active="facilities" lang="{{ lang }}" on-set-lang="{{ setLang }}" hint-size="100%,96px"></dc-import>

  <section style="max-width:1320px;margin:0 auto;padding:64px 40px 56px;">
    <div style="font-size:12.5px;letter-spacing:3px;text-transform:uppercase;color:#CB2125;font-weight:600;margin-bottom:24px;">{{ t.kicker }}</div>
    <h1 style="font-family:'Libre Caslon Text',serif;font-weight:400;font-size:clamp(32px,6vw,56px);line-height:1.14;margin:0 0 28px;color:#2A397D;max-width:840px;letter-spacing:-0.5px;">{{ t.title }}</h1>
    <p style="font-size:18px;line-height:1.8;font-weight:300;color:#4A4438;max-width:640px;margin:0;">{{ t.intro }}</p>
  </section>

  <section style="max-width:1320px;margin:0 auto;padding:0 40px 40px;display:flex;flex-direction:column;gap:100px;">
    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:center;">
      <div>
        <div style="font-family:'Libre Caslon Text',serif;font-size:15px;color:#CB2125;margin-bottom:22px;">01</div>
        <h2 style="font-family:'Libre Caslon Text',serif;font-weight:400;font-size:30px;color:#2A397D;margin:0 0 18px;letter-spacing:-0.3px;">{{ t.s1Title }}</h2>
        <p style="font-size:16px;line-height:1.8;font-weight:300;color:#4A4438;margin:0;">{{ t.s1Body }}</p>
      </div>
      <div style="height:340px;border-radius:8px;overflow:hidden;">
        <img src="assets/import-lines.jpg" alt="Crates of imported apples stacked in cold storage" style="width:100%;height:100%;object-fit:cover;display:block;" />
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:center;">
      <div>
        <div style="font-family:'Libre Caslon Text',serif;font-size:15px;color:#CB2125;margin-bottom:22px;">02</div>
        <h2 style="font-family:'Libre Caslon Text',serif;font-weight:400;font-size:30px;color:#2A397D;margin:0 0 18px;letter-spacing:-0.3px;">{{ t.s2Title }}</h2>
        <p style="font-size:16px;line-height:1.8;font-weight:300;color:#4A4438;margin:0;">{{ t.s2Body }}</p>
      </div>
      <div style="height:340px;border-radius:8px;overflow:hidden;">
        <img src="assets/pack-house.jpg" alt="Workers packing dates into containers on a pack house line" style="width:100%;height:100%;object-fit:cover;display:block;" />
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:center;">
      <div>
        <div style="font-family:'Libre Caslon Text',serif;font-size:15px;color:#CB2125;margin-bottom:22px;">03</div>
        <h2 style="font-family:'Libre Caslon Text',serif;font-weight:400;font-size:30px;color:#2A397D;margin:0 0 18px;letter-spacing:-0.3px;">{{ t.s3Title }}</h2>
        <p style="font-size:16px;line-height:1.8;font-weight:300;color:#4A4438;margin:0;">{{ t.s3Body }}</p>
      </div>
      <div style="height:340px;border-radius:8px;overflow:hidden;">
        <img src="assets/cold-chain.jpg" alt="Cold storage warehouse stacked with produce crates" style="width:100%;height:100%;object-fit:cover;display:block;" />
      </div>
    </div>

    <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:56px;align-items:center;">
      <div>
        <div style="font-family:'Libre Caslon Text',serif;font-size:15px;color:#CB2125;margin-bottom:22px;">04</div>
        <h2 style="font-family:'Libre Caslon Text',serif;font-weight:400;font-size:30px;color:#2A397D;margin:0 0 18px;letter-spacing:-0.3px;">{{ t.s4Title }}</h2>
        <p style="font-size:16px;line-height:1.8;font-weight:300;color:#4A4438;margin:0;">{{ t.s4Body }}</p>
      </div>
      <div style="height:340px;border-radius:8px;overflow:hidden;">
        <img src="assets/shipping-truck.jpg" alt="Delivery truck on the road" style="width:100%;height:100%;object-fit:cover;display:block;" />
      </div>
    </div>
  </section>

  <dc-import name="Footer" lang="{{ lang }}" hint-size="100%,360px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const STRINGS = {
  en: {
    kicker: 'Our facilities',
    title: 'Everything produce needs to stay fresh, under one operation.',
    intro: 'Import, pack house and cold chain work together as one continuous line — so produce is handled once, packed properly, and never sits outside the cold chain.',
    s1Title: 'Direct import lines', s1Body: 'We import produce directly at wholesale volume, giving us control over quality and consistent pricing before it ever reaches the pack house.',
    s2Title: 'Our own pack house', s2Body: 'Every order is sorted, graded and packaged in-house, so what leaves our facility meets the same standard every time — no matter the order size.',
    s3Title: 'Continuous cold chain', s3Body: "Our cold chain facility holds produce at the right temperature from pack house to dispatch, so freshness doesn't drop between storage and delivery.",
    s4Title: 'Shipping across Tanzania & Zanzibar', s4Body: 'From dispatch, orders are shipped or delivered anywhere in Tanzania or Zanzibar — arranged directly with our sales office.',
  },
  sw: {
    kicker: 'Vituo vyetu',
    title: 'Kila kitu ambacho bidhaa zinahitaji kubaki bichi, chini ya operesheni moja.',
    intro: 'Uagizaji, kiwanda cha ufungashaji na mnyororo baridi hufanya kazi pamoja kama mstari mmoja unaoendelea — hivyo bidhaa hushughulikiwa mara moja, kufungashwa vizuri, na haziondoki kwenye mnyororo baridi.',
    s1Title: 'Njia za uagizaji wa moja kwa moja', s1Body: 'Tunaagiza bidhaa moja kwa moja kwa kiasi cha jumla, tukipata udhibiti wa ubora na bei thabiti kabla ya kufika kwenye kiwanda cha ufungashaji.',
    s2Title: 'Kiwanda chetu cha ufungashaji', s2Body: 'Kila oda hupangwa, kupimwa daraja na kufungashwa ndani ya kampuni, ili kinachotoka kituoni petu kikidhi kiwango kile kile kila wakati — bila kujali ukubwa wa oda.',
    s3Title: 'Mnyororo baridi unaoendelea', s3Body: 'Kituo chetu cha mnyororo baridi huhifadhi bidhaa kwenye joto sahihi kutoka kiwanda cha ufungashaji hadi usafirishaji, hivyo ubichi haupungui kati ya uhifadhi na usambazaji.',
    s4Title: 'Usafirishaji Tanzania na Zanzibar', s4Body: 'Kutoka kwenye usafirishaji, oda husafirishwa au kupelekwa popote Tanzania au Zanzibar — hupangwa moja kwa moja na ofisi yetu ya mauzo.',
  },
};

class Component extends DCLogic {
  state = { lang: (typeof sessionStorage !== 'undefined' && sessionStorage.getItem('ringfresh_lang')) || 'en' };
  renderVals() {
    const lang = this.state.lang;
    return { t: STRINGS[lang] || STRINGS.en, lang, setLang: (l) => { this.setState({ lang: l }); try { sessionStorage.setItem('ringfresh_lang', l); } catch (e) {} } };
  }
}
</script>
</body>
</html>
