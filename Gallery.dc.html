<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Ringo Fresh">
<meta property="og:title" content="Gallery, Ringo Fresh">
<meta property="og:description" content="Wholesale fruits & vegetables in Tanzania. Best pricing, cold chain freshness, and delivery across Tanzania & Zanzibar.">
<meta property="og:image" content="https://www.ringofresh.co.tz/assets/og-share.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://www.ringofresh.co.tz/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="Gallery, Ringo Fresh">
<meta name="twitter:description" content="Wholesale fruits & vegetables in Tanzania. Best pricing, cold chain freshness, and delivery across Tanzania & Zanzibar.">
<meta name="twitter:image" content="https://www.ringofresh.co.tz/assets/og-share.png">

<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#FAFAFA;}
  #gallery-carousel{display:none;}
  #gallery-carousel::-webkit-scrollbar{display:none;}
  #gallery-carousel image-slot::part(image){touch-action:pan-y pan-x;}
  #gallery-carousel image-slot{touch-action:pan-y pan-x;}
  @media (max-width: 780px) {
    #gallery-grid-section{padding:0 !important;}
    #gallery-grid{display:none !important;}
    #gallery-carousel{display:flex !important;}
  }
</style>
<script src="image-slot.js"></script>
</helmet>
<div style="background:#FAFAFA;font-family:'Manrope',sans-serif;color:#241F1A;">
  <dc-import name="Nav" active="gallery" lang="{{ lang }}" on-set-lang="{{ setLang }}" hint-size="100%,96px"></dc-import>

  <section style="max-width:1320px;margin:0 auto;padding:64px 40px 56px;">
    <div style="font-size:12.5px;letter-spacing:3px;text-transform:uppercase;color:#CB2125;font-weight:600;margin-bottom:24px;">{{ t.kicker }}</div>
    <h1 style="font-family:'Libre Caslon Text',serif;font-weight:400;font-size:clamp(34px,6vw,56px);line-height:1.14;margin:0 0 28px;color:#2A397D;max-width:840px;letter-spacing:-0.5px;">{{ t.title }}</h1>
    <p style="font-size:18px;line-height:1.8;font-weight:300;color:#4A4438;max-width:640px;margin:0;">{{ t.intro }}</p>
  </section>

  <section id="gallery-grid-section" style="max-width:1320px;margin:0 auto;padding:0 40px 130px;">
    <div id="gallery-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:24px;">
      <sc-for list="{{ slots }}" as="s" hint-placeholder-count="60">
        <div style="border-radius:8px;overflow:hidden;background:#FFFFFF;border:1px solid #EFE9DC;">
          <div style="width:100%;aspect-ratio:1;">
            <image-slot id="{{ s.id }}" src="{{ s.src }}" placeholder="{{ s.placeholder }}" shape="rect" data-comment-anchor="6dd6e1de87-image-slot"></image-slot>
          </div>
        </div>
      </sc-for>
    </div>
  </section>

  <section style="padding:32px 0 96px;">
    <div style="max-width:460px;margin:0 auto;">
      <div id="gallery-carousel" ref="{{ carouselRef }}" onscroll="{{ handleScroll }}" style="overflow-x:auto;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;">
        <sc-for list="{{ slots }}" as="s" hint-placeholder-count="60">
          <div style="flex:0 0 100%;scroll-snap-align:start;border-radius:8px;overflow:hidden;background:#FFFFFF;border:1px solid #EFE9DC;">
            <div style="width:100%;aspect-ratio:1;">
              <image-slot id="{{ s.mobileId }}" src="{{ s.src }}" placeholder="{{ s.placeholder }}" shape="rect"></image-slot>
            </div>
          </div>
        </sc-for>
      </div>
      <div style="display:flex;align-items:center;justify-content:center;gap:20px;margin-top:20px;">
        <button type="button" aria-label="Previous photo" onclick="{{ goPrev }}" style="cursor:pointer;width:44px;height:44px;border-radius:50%;border:1px solid #E2D9C8;background:#FFFFFF;color:#2A397D;font-size:18px;line-height:1;">‹</button>
        <span style="font-size:13px;color:#8A8371;font-weight:600;min-width:56px;text-align:center;">{{ counterLabel }}</span>
        <button type="button" aria-label="Next photo" onclick="{{ goNext }}" style="cursor:pointer;width:44px;height:44px;border-radius:50%;border:1px solid #E2D9C8;background:#FFFFFF;color:#2A397D;font-size:18px;line-height:1;">›</button>
      </div>
    </div>
  </section>

  <dc-import name="Footer" lang="{{ lang }}" hint-size="100%,360px"></dc-import>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{}">
const STRINGS = {
  en: {
    kicker: 'Gallery',
    title: 'Our produce, in real photos.',
    intro: 'A closer look at the fruits and vegetables we supply. Drag your own product photos onto any tile below to fill it in.',
    dropPlaceholder: 'Drop a photo',
    swipeHint: 'Swipe to see more →',
  },
  sw: {
    kicker: 'Picha',
    title: 'Bidhaa zetu, kwa picha halisi.',
    intro: 'Angalia kwa karibu matunda na mboga tunazosambaza. Buruta picha zako za bidhaa kwenye kisanduku chochote hapa chini ili kukijaza.',
    dropPlaceholder: 'Weka picha hapa',
    swipeHint: 'Telezesha kuona zaidi →',
  },
};

class Component extends DCLogic {
  state = {
    lang: (typeof sessionStorage !== 'undefined' && sessionStorage.getItem('ringfresh_lang')) || 'en',
    activeIndex: 0,
  };
  carouselRef = { current: null };

  scrollToIndex(i) {
    const el = this.carouselRef.current;
    if (!el) return;
    el.scrollTo({ left: i * el.clientWidth, behavior: 'smooth' });
  }

  renderVals() {
    const lang = this.state.lang;
    const t = STRINGS[lang] || STRINGS.en;
    // Near-duplicate burst shots removed (same crate/angle, shot seconds apart):
    // 1371/1372 (dup of 1370), 1403 (dup of 1402), 1421 (dup of 1420),
    // 1510 (dup of 1509), 1561 (dup of 1556), 1566/1567/1568 (dup of 1565).
    const ids = [
      1347,1349,1360,1370,1394,
      1405,1407,1409,1420,1427,1437,1439,1440,
      1443,1446,1447,1449,1473,1474,1482,1486,1497,
      1509,1511,1513,1555,1556,1560,
    ];
    const photos = ids.map(id => 'assets/gallery/' + id + '.jpg');
    const slots = photos.map((src, i) => ({
      id: 'gallery-product-' + i,
      mobileId: 'gallery-product-m-' + i,
      src,
      placeholder: t.dropPlaceholder,
    }));
    const total = slots.length;
    const activeIndex = Math.min(this.state.activeIndex, total - 1);
    return {
      t, lang,
      setLang: (l) => { this.setState({ lang: l }); try { sessionStorage.setItem('ringfresh_lang', l); } catch (e) {} },
      slots,
      carouselRef: this.carouselRef,
      counterLabel: (activeIndex + 1) + ' / ' + total,
      goPrev: () => { const i = Math.max(0, activeIndex - 1); this.setState({ activeIndex: i }); this.scrollToIndex(i); },
      goNext: () => { const i = Math.min(total - 1, activeIndex + 1); this.setState({ activeIndex: i }); this.scrollToIndex(i); },
      handleScroll: (e) => {
        const el = e.target;
        if (!el.clientWidth) return;
        const i = Math.round(el.scrollLeft / el.clientWidth);
        if (i !== this.state.activeIndex) this.setState({ activeIndex: i });
      },
    };
  }
}
</script>
</body>
</html>
