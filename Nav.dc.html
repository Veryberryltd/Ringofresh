<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Breakpoint switch only — all other styling stays inline. Below 880px the
     inline link row is hidden and the burger-triggered dropdown takes over. */
  @media (max-width: 880px) {
    .rf-nav-links { display: none !important; }
    .rf-nav-burger { display: flex !important; }
  }
</style>
</helmet>
<nav style="position:sticky;top:0;z-index:100;background:rgba(250,250,250,0.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(36,31,26,0.08);font-family:'Manrope',sans-serif;">
  <div style="max-width:1320px;margin:0 auto;padding:8px clamp(16px,4vw,40px);display:flex;align-items:center;justify-content:space-between;min-height:96px;gap:clamp(12px,3vw,32px);">
    <a href="Home.dc.html" style="display:flex;align-items:center;flex-shrink:0;">
      <img src="assets/ringfresh-logo.svg" alt="Ringo Fresh" style="height:clamp(48px,9vw,110px);width:auto;display:block;" />
    </a>
    <div class="rf-nav-links" style="display:flex;align-items:center;gap:clamp(14px,2.5vw,34px);flex:1;justify-content:center;flex-wrap:wrap;row-gap:6px;">
      <a href="Home.dc.html" style="text-decoration:none;padding:4px 0;font-size:13.5px;letter-spacing:0.3px;font-weight:500;color:{{ homeColor }};border-bottom:{{ homeBorder }};">Home</a>
      <a href="About.dc.html" style="text-decoration:none;padding:4px 0;font-size:13.5px;letter-spacing:0.3px;font-weight:500;color:{{ aboutColor }};border-bottom:{{ aboutBorder }};">About</a>
      <a href="Facilities.dc.html" style="text-decoration:none;padding:4px 0;font-size:13.5px;letter-spacing:0.3px;font-weight:500;color:{{ facilitiesColor }};border-bottom:{{ facilitiesBorder }};">Facilities</a>
      <a href="Gallery.dc.html" style="text-decoration:none;padding:4px 0;font-size:13.5px;letter-spacing:0.3px;font-weight:500;color:{{ galleryColor }};border-bottom:{{ galleryBorder }};">Gallery</a>
      <a href="PriceList.dc.html" style="text-decoration:none;padding:4px 0;font-size:13.5px;letter-spacing:0.3px;font-weight:500;color:{{ pricelistColor }};border-bottom:{{ pricelistBorder }};">Price List</a>
      <a href="Order.dc.html" style="text-decoration:none;padding:4px 0;font-size:13.5px;letter-spacing:0.3px;font-weight:500;color:{{ orderColor }};border-bottom:{{ orderBorder }};">Place an Order</a>
      <a href="Contact.dc.html" style="text-decoration:none;padding:4px 0;font-size:13.5px;letter-spacing:0.3px;font-weight:500;color:{{ contactColor }};border-bottom:{{ contactBorder }};">Contact</a>
    </div>
    <a href="Order.dc.html" class="rf-nav-links" style="flex-shrink:0;text-decoration:none;background:#CB2125;border:1px solid #CB2125;color:#FAF6EE;font-weight:600;font-size:13px;letter-spacing:0.3px;padding:clamp(9px,2vw,11px) clamp(16px,3vw,22px);border-radius:100px;white-space:nowrap;">Place an Order</a>
    <button type="button" class="rf-nav-burger" onclick="{{ toggleMenu }}" aria-label="Menu" style="display:none;flex-shrink:0;width:44px;height:44px;border-radius:10px;border:1px solid rgba(36,31,26,0.14);background:#FFFFFF;align-items:center;justify-content:center;cursor:pointer;flex-direction:column;gap:5px;">
      <span style="display:block;width:20px;height:2px;background:#2A397D;border-radius:2px;"></span>
      <span style="display:block;width:20px;height:2px;background:#2A397D;border-radius:2px;"></span>
      <span style="display:block;width:20px;height:2px;background:#2A397D;border-radius:2px;"></span>
    </button>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="padding:8px clamp(16px,4vw,40px) 20px;display:flex;flex-direction:column;gap:4px;border-top:1px solid rgba(36,31,26,0.08);">
      <a href="Home.dc.html" style="text-decoration:none;padding:12px 4px;font-size:15px;font-weight:500;color:{{ homeColor }};">Home</a>
      <a href="About.dc.html" style="text-decoration:none;padding:12px 4px;font-size:15px;font-weight:500;color:{{ aboutColor }};">About</a>
      <a href="Facilities.dc.html" style="text-decoration:none;padding:12px 4px;font-size:15px;font-weight:500;color:{{ facilitiesColor }};">Facilities</a>
      <a href="Gallery.dc.html" style="text-decoration:none;padding:12px 4px;font-size:15px;font-weight:500;color:{{ galleryColor }};">Gallery</a>
      <a href="PriceList.dc.html" style="text-decoration:none;padding:12px 4px;font-size:15px;font-weight:500;color:{{ pricelistColor }};">Price List</a>
      <a href="Order.dc.html" style="text-decoration:none;padding:12px 4px;font-size:15px;font-weight:500;color:{{ orderColor }};">Place an Order</a>
      <a href="Contact.dc.html" style="text-decoration:none;padding:12px 4px;font-size:15px;font-weight:500;color:{{ contactColor }};">Contact</a>
    </div>
  </sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:96},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;facilities&quot;,&quot;gallery&quot;,&quot;pricelist&quot;,&quot;order&quot;,&quot;contact&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false };
  renderVals() {
    const active = this.props.active || 'home';
    const style = (key) => ({
      color: active === key ? '#CB2125' : '#2A397D',
      border: active === key ? '1.5px solid #CB2125' : '1.5px solid transparent',
    });
    const home = style('home'), about = style('about'), facilities = style('facilities'),
      gallery = style('gallery'), pricelist = style('pricelist'), contact = style('contact'), order = style('order');
    return {
      homeColor: home.color, homeBorder: home.border,
      aboutColor: about.color, aboutBorder: about.border,
      facilitiesColor: facilities.color, facilitiesBorder: facilities.border,
      galleryColor: gallery.color, galleryBorder: gallery.border,
      pricelistColor: pricelist.color, pricelistBorder: pricelist.border,
      contactColor: contact.color, contactBorder: contact.border,
      orderColor: order.color, orderBorder: order.border,
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
    };
  }
}
</script>
</body>
</html>
