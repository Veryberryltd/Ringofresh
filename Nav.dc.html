<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Libre+Caslon+Text:wght@400;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* Breakpoint switch only — all other styling stays inline. Below 880px the
     inline link row is hidden and the burger-triggered dropdown takes over. */
  @media (max-width: 880px) {
    .rf-nav-links { display: none !important; }
    .rf-nav-burger { display: flex !important; margin-left: auto !important; }
    .rf-nav-mobile-actions { display: flex !important; }
    .rf-nav-row { justify-content: flex-start !important; }
  }
</style>
</helmet>
<nav style="position:sticky;top:0;z-index:100;background:rgba(250,250,250,0.86);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid rgba(36,31,26,0.08);font-family:'Manrope',sans-serif;">
  <div class="rf-nav-row" style="max-width:1320px;margin:0 auto;padding:6px clamp(16px,4vw,40px);display:flex;align-items:center;justify-content:space-between;min-height:48px;gap:clamp(12px,3vw,32px);position:relative;">
    <a href="Home.dc.html" style="display:flex;align-items:center;flex-shrink:0;">
      <img src="assets/ringfresh-logo-cropped.svg" alt="Ringo Fresh" style="height:clamp(45px,6vw,53px);width:auto;display:block;" />
    </a>
    <div class="rf-nav-links" style="display:flex;align-items:center;gap:clamp(8px,1.6vw,24px);flex:1;justify-content:center;flex-wrap:nowrap;white-space:nowrap;">
      <a href="Home.dc.html" style="text-decoration:none;padding:4px 0;font-size:17px;letter-spacing:0.2px;font-weight:500;color:{{ homeColor }};border-bottom:{{ homeBorder }};">Home</a>
      <a href="About.dc.html" style="text-decoration:none;padding:4px 0;font-size:17px;letter-spacing:0.2px;font-weight:500;color:{{ aboutColor }};border-bottom:{{ aboutBorder }};">About</a>
      <a href="Facilities.dc.html" style="text-decoration:none;padding:4px 0;font-size:17px;letter-spacing:0.2px;font-weight:500;color:{{ facilitiesColor }};border-bottom:{{ facilitiesBorder }};">Facilities</a>
      <a href="Gallery.dc.html" style="text-decoration:none;padding:4px 0;font-size:17px;letter-spacing:0.2px;font-weight:500;color:{{ galleryColor }};border-bottom:{{ galleryBorder }};">Gallery</a>
      <a href="PriceList.dc.html" style="text-decoration:none;padding:4px 0;font-size:17px;letter-spacing:0.2px;font-weight:500;color:{{ pricelistColor }};border-bottom:{{ pricelistBorder }};">Price List</a>
      <a href="Order.dc.html" style="text-decoration:none;padding:4px 0;font-size:17px;letter-spacing:0.2px;font-weight:500;color:{{ orderColor }};border-bottom:{{ orderBorder }};">Place an Order</a>
      <a href="Contact.dc.html" style="text-decoration:none;padding:4px 0;font-size:17px;letter-spacing:0.2px;font-weight:500;color:{{ contactColor }};border-bottom:{{ contactBorder }};">Contact</a>
    </div>
    <a href="Order.dc.html" class="rf-nav-links" style="flex-shrink:0;text-decoration:none;background:#CB2125;border:1px solid #CB2125;color:#FAF6EE;font-weight:600;font-size:13px;letter-spacing:0.3px;padding:clamp(9px,2vw,11px) clamp(16px,3vw,22px);border-radius:100px;white-space:nowrap;">Place an Order</a>
    <div class="rf-nav-mobile-actions" style="display:none;align-items:center;gap:14px;flex-shrink:0;position:absolute;left:50%;transform:translateX(-50%);">
      <a href="Order.dc.html" style="text-decoration:none;background:#CB2125;color:#FAF6EE;font-weight:600;font-size:15px;letter-spacing:0.2px;padding:12px 20px;border-radius:100px;white-space:nowrap;">Place an Order</a>
    </div>
    <div style="display:flex;align-items:center;gap:10px;margin-left:auto;">
      <a href="https://wa.me/255795471471" target="_blank" rel="noopener" aria-label="Chat on WhatsApp" style="flex-shrink:0;width:48px;height:48px;border-radius:50%;background:#25D366;display:flex;align-items:center;justify-content:center;">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="#FFFFFF"><path d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38c1.45.79 3.08 1.21 4.74 1.21h.01c5.46 0 9.91-4.45 9.91-9.91c0-2.65-1.03-5.14-2.9-7.01A9.816 9.816 0 0 0 12.05 2zm0 18.15h-.01c-1.48 0-2.93-.4-4.2-1.15l-.3-.18l-3.12.82l.83-3.04l-.2-.31a8.264 8.264 0 0 1-1.27-4.42c0-4.54 3.7-8.24 8.25-8.24c2.2 0 4.27.86 5.83 2.42a8.184 8.184 0 0 1 2.41 5.83c0 4.55-3.7 8.25-8.25 8.25zm4.52-6.18c-.25-.12-1.47-.72-1.69-.81c-.23-.08-.39-.12-.56.13c-.17.24-.64.81-.78.97c-.14.17-.29.19-.53.06c-.25-.12-1.04-.38-1.98-1.22c-.73-.65-1.23-1.46-1.37-1.7c-.14-.25-.02-.38.11-.51c.11-.11.25-.29.37-.43c.13-.14.17-.24.25-.4c.08-.17.04-.31-.02-.43c-.06-.12-.56-1.35-.77-1.85c-.2-.48-.41-.42-.56-.43c-.14-.01-.31-.01-.48-.01c-.17 0-.43.06-.66.31c-.22.24-.87.85-.87 2.07c0 1.22.89 2.4 1.01 2.57c.13.17 1.76 2.69 4.27 3.77c.6.26 1.06.41 1.43.53c.6.19 1.14.16 1.57.1c.48-.07 1.47-.6 1.68-1.18c.21-.58.21-1.07.14-1.18c-.06-.11-.23-.17-.48-.29z"></path></svg>
      </a>
      <button type="button" class="rf-nav-burger" onclick="{{ toggleMenu }}" aria-label="Menu" style="display:none;flex-shrink:0;width:44px;height:44px;border-radius:10px;border:1px solid rgba(36,31,26,0.14);background:#FFFFFF;align-items:center;justify-content:center;cursor:pointer;flex-direction:column;gap:5px;">
        <span style="display:block;width:20px;height:2px;background:#2A397D;border-radius:2px;"></span>
        <span style="display:block;width:20px;height:2px;background:#2A397D;border-radius:2px;"></span>
        <span style="display:block;width:20px;height:2px;background:#2A397D;border-radius:2px;"></span>
      </button>
    </div>
  </div>
  <sc-if value="{{ menuOpen }}" hint-placeholder-val="{{ false }}">
    <div style="padding:8px clamp(16px,4vw,40px) 20px;display:flex;flex-direction:column;gap:4px;border-top:1px solid rgba(36,31,26,0.08);">
      <a href="Home.dc.html" style="text-decoration:none;padding:12px 4px;font-size:15px;font-weight:500;color:{{ homeColor }};">Home</a>
      <a href="About.dc.html" style="text-decoration:none;padding:12px 4px;font-size:15px;font-weight:500;color:{{ aboutColor }};">About</a>
      <a href="Facilities.dc.html" style="text-decoration:none;padding:12px 4px;font-size:15px;font-weight:500;color:{{ facilitiesColor }};">Facilities</a>
      <a href="Gallery.dc.html" style="text-decoration:none;padding:12px 4px;font-size:15px;font-weight:500;color:{{ galleryColor }};">Gallery</a>
      <a href="PriceList.dc.html" style="text-decoration:none;padding:12px 4px;font-size:15px;font-weight:500;color:{{ pricelistColor }};">Price List</a>
      <a href="Order.dc.html" style="text-decoration:none;padding:12px 4px;font-size:15px;font-weight:500;color:{{ orderColor }};">Place an Order</a>
      <a href="Contact.dc.html" style="text-decoration:none;padding:12px 4px;font-size:15px;font-weight:500;color:{{ contactColor }};">Contact</a>
    </div>
  </sc-if>
</nav>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1320,&quot;height&quot;:96},&quot;active&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;home&quot;,&quot;options&quot;:[&quot;home&quot;,&quot;about&quot;,&quot;facilities&quot;,&quot;gallery&quot;,&quot;pricelist&quot;,&quot;order&quot;,&quot;contact&quot;],&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { menuOpen: false };
  renderVals() {
    const active = this.props.active || 'home';
    const style = (key) => ({
      color: active === key ? '#CB2125' : '#2A397D',
      border: active === key ? '1.5px solid #CB2125' : '1.5px solid transparent',
    });
    const home = style('home'), about = style('about'), facilities = style('facilities'),
      gallery = style('gallery'), pricelist = style('pricelist'), contact = style('contact'), order = style('order');
    return {
      homeColor: home.color, homeBorder: home.border,
      aboutColor: about.color, aboutBorder: about.border,
      facilitiesColor: facilities.color, facilitiesBorder: facilities.border,
      galleryColor: gallery.color, galleryBorder: gallery.border,
      pricelistColor: pricelist.color, pricelistBorder: pricelist.border,
      contactColor: contact.color, contactBorder: contact.border,
      orderColor: order.color, orderBorder: order.border,
      menuOpen: this.state.menuOpen,
      toggleMenu: () => this.setState(s => ({ menuOpen: !s.menuOpen })),
    };
  }
}
</script>
</body>
</html>
